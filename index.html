<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotizZettel V1.2.0</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f2f2f2;margin:0;padding:20px}
.main{max-width:760px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
h1{margin:0}.info{color:#666;margin:8px 0 18px}
.row{display:flex;gap:10px}
#neu{flex:1;padding:12px;font-size:18px}
button{padding:12px 18px;font-size:18px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
.del{background:#dc2626}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:10px}
input[type=checkbox]{width:24px;height:24px}
.txt{flex:1;font-size:18px}
.erledigt{text-decoration:line-through;color:#777}
#vorschlaege{display:none;border:1px solid #ccc;border-top:none;max-height:180px;overflow:auto}
.v{padding:10px;background:#fff;cursor:pointer}
.v:hover{background:#e8f0fe}
</style>
</head>
<body>
<div class="main">
<h1>NotizZettel</h1>
<div class="info">Version 1.2.0 • <span id="datum"></span></div>

<div class="row">
<input id="neu" autocomplete="off" placeholder="Neue Notiz eingeben...">
<button id="add">Hinzufügen</button>
</div>
<div id="vorschlaege"></div>

<ul id="liste"></ul>
</div>

<script>
const KEY_NOTIZEN="NZ_Notizen";
const KEY_WOERTER="NZ_Woerterbuch";

let notizen=JSON.parse(localStorage.getItem(KEY_NOTIZEN)||"[]");
let woerter=JSON.parse(localStorage.getItem(KEY_WOERTER)||"[]");

const input=document.getElementById("neu");
const liste=document.getElementById("liste");
const box=document.getElementById("vorschlaege");

document.getElementById("datum").textContent=
new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});

function speichernNotizen(){localStorage.setItem(KEY_NOTIZEN,JSON.stringify(notizen));}
function speichernWoerter(){localStorage.setItem(KEY_WOERTER,JSON.stringify(woerter));}

function wortMerken(text){
 const eintrag=text.trim();
 if(!eintrag) return;
 if(!woerter.some(w=>w.toLowerCase()===eintrag.toLowerCase())){
   woerter.push(eintrag);
   woerter.sort((a,b)=>a.localeCompare(b,"de"));
   speichernWoerter();
 }
}

function render(){
 liste.innerHTML="";
 notizen.forEach((n,i)=>{
   const li=document.createElement("li");
   const cb=document.createElement("input");
   cb.type="checkbox";
   cb.checked=n.ok;
   cb.onchange=()=>{notizen[i].ok=cb.checked;speichernNotizen();render();}
   const sp=document.createElement("span");
   sp.className="txt"+(n.ok?" erledigt":"");
   sp.textContent=n.text;
   const del=document.createElement("button");
   del.className="del";
   del.textContent="Löschen";
   del.onclick=()=>{notizen.splice(i,1);speichernNotizen();render();}
   li.append(cb,sp,del);
   liste.append(li);
 });
}

function add(){
 const t=input.value.trim();
 if(!t){input.focus();return;}
 notizen.push({text:t,ok:false});
 wortMerken(t);
 speichernNotizen();
 render();
 input.value="";
 box.style.display="none";
 input.focus();
}

function zeigeVorschlaege(){
 const s=input.value.trim().toLowerCase();
 box.innerHTML="";
 if(!s){box.style.display="none";return;}
 const treffer=woerter.filter(w=>w.toLowerCase().startsWith(s) && w.toLowerCase()!=s);
 if(treffer.length===0){box.style.display="none";return;}
 treffer.forEach(w=>{
   const d=document.createElement("div");
   d.className="v";
   d.textContent=w;
   d.onclick=()=>{input.value=w;box.style.display="none";input.focus();}
   box.appendChild(d);
 });
 box.style.display="block";
}

input.addEventListener("input",zeigeVorschlaege);
input.addEventListener("keydown",e=>{if(e.key==="Enter")add();});
document.getElementById("add").onclick=add;
render();
input.focus();
</script>
</body>
</html>
