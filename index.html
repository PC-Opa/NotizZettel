<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotizZettel V1.3.0 (GitHub Sync)</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f2f2f2;margin:0;padding:20px}
.main{max-width:760px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
h1{margin:0}.info{color:#666;margin:8px 0 18px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px}
#new-input{flex:1;padding:12px;font-size:18px}
button{padding:12px 18px;font-size:18px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
.del{background:#dc2626}
.sync-btn{background:#10b981;font-size:14px;padding:6px 12px}
ul{list-style:none;padding:0}
#notes-list{display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:10px}
input[type=checkbox]{width:24px;height:24px}
.txt{flex:1;font-size:18px}
.completed{text-decoration:line-through;color:#777}
#suggestions-box{display:none;border:1px solid #ccc;border-top:none;max-height:180px;overflow:auto}
.v{padding:10px;background:#fff;cursor:pointer}
.v:hover{background:#e8f0fe}
.gh-box{background:#f9fafb;border:1px solid #e5e7eb;padding:15px;border-radius:8px;margin-bottom:15px;display:none}
.gh-box input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
</style>
</head>
<body>
<div class="main">
<h1>NotizZettel</h1>
<div class="info">
<div>Version 1.3.0 • <span id="current-date"></span></div>
<div>
<button class="sync-btn" onclick="toggleGit()">⚙️ GitHub</button>
<button class="sync-btn" style="background:#4f46e5" onclick="syncWithGitHub()">🔄 Sync</button>
</div>
</div>
<div id="ghConfig" class="gh-box">
<h3>GitHub Verbindung</h3>
<input id="ghUser" placeholder="GitHub Benutzername">
<input id="ghRepo" placeholder="Repository Name">
<input id="ghToken" type="password" placeholder="Personal Access Token">
<button onclick="saveGitConfig()" style="font-size:14px;padding:6px 12px">Zugangsdaten merken</button>
</div>
<div class="row">
<input id="new-input" autocomplete="off" placeholder="Neue Notiz...">
<button id="add-btn">Hinzufügen</button>
</div>
<div id="suggestions-box"></div>
<ul id="notes-list"></ul>
</div>

<script>
const KEY_NOTIZEN="NZ_Notizen";
const KEY_WOERTER="NZ_Woerterbuch";
const KEY_GIT="NZ_GitConfig";

let notizen=JSON.parse(localStorage.getItem(KEY_NOTIZEN)||"[]");
let woerter=JSON.parse(localStorage.getItem(KEY_WOERTER)||"[]");
let gitConfig=JSON.parse(localStorage.getItem(KEY_GIT)||'{"user":"","repo":"","token":""}');

const input=document.getElementById("new-input");
const liste=document.getElementById("notes-list");
const box=document.getElementById("suggestions-box");

document.getElementById("current-date").textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
document.getElementById("ghUser").value=gitConfig.user||"";
document.getElementById("ghRepo").value=gitConfig.repo||"";
document.getElementById("ghToken").value=gitConfig.token||"";

function speichernNotizen(){localStorage.setItem(KEY_NOTIZEN,JSON.stringify(notizen));}
function speichernWoerter(){localStorage.setItem(KEY_WOERTER,JSON.stringify(woerter));}
function toggleGit(){const b=document.getElementById("ghConfig");b.style.display=b.style.display==="block"?"none":"block";}
function saveGitConfig(){
gitConfig={
user:document.getElementById("ghUser").value.trim(),
repo:document.getElementById("ghRepo").value.trim(),
token:document.getElementById("ghToken").value.trim()
};
localStorage.setItem(KEY_GIT,JSON.stringify(gitConfig));
alert("Zugangsdaten lokal gespeichert!");
toggleGit();
}

async function syncWithGitHub(){
if(!gitConfig.user||!gitConfig.repo||!gitConfig.token){
alert("Bitte zuerst GitHub-Zugangsdaten ausfüllen!");
toggleGit();
return;
}
const url=`https://api.github.com/repos/${gitConfig.user}/${gitConfig.repo}/contents/daten.json`;
const auth={
"Authorization":`token ${gitConfig.token}`,
"Accept":"application/vnd.github.v3+json"
};
try{
let sha="";
const res=await fetch(url,{headers:auth});
if(res.status===200){
const fileData=await res.json();
sha=fileData.sha;
}
const payload={notizen:notizen,woerter:woerter};
const body={
message:"NotizZettel Synchronisation",
content:btoa(unescape(encodeURIComponent(JSON.stringify(payload)))),
sha:sha||undefined
};
const putRes=await fetch(url,{
method:"PUT",
headers:auth,
body:JSON.stringify(body)
});
if(putRes.ok){
alert("Synchronisation erfolgreich gespeichert!");
}else{
alert("Fehler beim Speichern!\nStatus: "+putRes.status+"\n\n"+await putRes.text());
}
}catch(e){
alert("Verbindungsfehler: "+e.message);
}
}

function wortMerken(text){
const e=text.trim();
if(!e)return;
if(!woerter.some(w=>w.toLowerCase()===e.toLowerCase())){
woerter.push(e);
woerter.sort((a,b)=>a.localeCompare(b,"de"));
speichernWoerter();
}
}
function render(){
liste.innerHTML="";
notizen.forEach((n,i)=>{
const li=document.createElement("li");
const cb=document.createElement("input");
cb.type="checkbox";
cb.checked=n.ok;
cb.onchange=()=>{notizen[i].ok=cb.checked;speichernNotizen();render();};
const sp=document.createElement("span");
sp.className="txt"+(n.ok?" completed":"");
sp.textContent=n.text;
const del=document.createElement("button");
del.className="del";
del.textContent="Löschen";
del.onclick=()=>{notizen.splice(i,1);speichernNotizen();render();};
li.append(cb,sp,del);
liste.append(li);
});
}
function add(){
const t=input.value.trim();
if(!t){input.focus();return;}
notizen.push({text:t,ok:false});
wortMerken(t);
speichernNotizen();
render();
input.value="";
box.style.display="none";
input.focus();
}
function zeigeVorschlaege(){
const s=input.value.trim().toLowerCase();
box.innerHTML="";
if(!s){box.style.display="none";return;}
const t=woerter.filter(w=>w.toLowerCase().startsWith(s)&&w.toLowerCase()!=s);
if(t.length===0){box.style.display="none";return;}
t.forEach(w=>{
const d=document.createElement("div");
d.className="v";
d.textContent=w;
d.onclick=()=>{input.value=w;box.style.display="none";input.focus();};
box.appendChild(d);
});
box.style.display="block";
}
input.addEventListener("input",zeigeVorschlaege);
input.addEventListener("keydown",e=>{if(e.key==="Enter")add();});
document.getElementById("add-btn").onclick=add;
render();
input.focus();
</script>
</body>
</html>
